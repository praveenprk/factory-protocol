# Automated update proposals (V-ENG-008-05). Each update arrives as a pull
# request. Updates are supply-chain changes: they carry the label `security`
# and only the governor merges them (DECISION-002).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [security]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [security]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: [security]
