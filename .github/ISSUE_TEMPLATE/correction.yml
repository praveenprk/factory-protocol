name: Correction
description: The page says something the factory does not do, or leaves out something it does
body:
  - type: textarea
    id: page
    attributes:
      label: What the page says
      description: Quote it, and name the section (e.g. "The line", "Floor rules").
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: What the factory does
      description: The factory source that says so, at a commit. See docs/DECISIONS.md DECISION-002.
    validations:
      required: true
